[package]
name = "kanbanflow-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for KanbanFlow — gh-style ticket management with image attachment round-trip"
license = "MIT"

[[bin]]
name = "kf"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
keyring = "4.1.5"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "multipart", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
